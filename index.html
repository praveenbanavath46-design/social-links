<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesh    git clone https://github.com/praveenbanavath46-design/social-links.giteet" href="styles.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <img class="avatar" src="avatar-jessica.jpeg" alt="Jessica Randall">
            <h1 class="name">Jessica Randall</h1>
            <p class="location">London, United Kingdom</p>
            <blockquote class="quote">“Front-end developer and avid reader.”</blockquote>

            <nav class="links" aria-label="social links">
                <a class="btn" href="#" target="_blank">GitHub</a>
                <a class="btn" href="#" target="_blank">Frontend Mentor</a>
                <a class="btn" href="#" target="_blank">LinkedIn</a>
                <a class="btn" href="#" target="_blank">Twitter</a>
                <a class="btn" href="#" target="_blank">Instagram</a>
            </nav>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
